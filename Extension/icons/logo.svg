<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a88"/>
      <stop offset="0.5" stop-color="#e94560"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="4" y="4" width="120" height="120" rx="30"/>
    </clipPath>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="58" fill="url(#gloss)" clip-path="url(#tile)"/>

  <!-- Sync arrows around the play button -->
  <g fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round">
    <path d="M30.17 51.69 A36 36 0 0 1 82 32.82"/>
    <path d="M97.83 76.31 A36 36 0 0 1 46 95.18"/>
  </g>
  <g fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round">
    <path d="M89.5 37.2 L84.2 25.1 L75.6 39.5 Z"/>
    <path d="M38.5 90.8 L43.8 102.9 L52.4 88.5 Z"/>
  </g>

  <!-- Play -->
  <path d="M55 48 L81 64 L55 80 Z" fill="#fff" stroke="#fff" stroke-width="7" stroke-linejoin="round"/>
</svg>
