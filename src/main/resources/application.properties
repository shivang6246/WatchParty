spring.application.name=watchParty

# Optional local overrides (gitignored) - secrets live here, not in this file
spring.config.import=optional:file:./local.properties

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/watchparty}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:bXlTdXBlclNlY3JldEtleUZvcldhdGNoUGFydHlBcHBsaWNhdGlvbjIwMjY=}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000

# Cache
spring.cache.type=redis
app.cache.default-ttl-minutes=${CACHE_DEFAULT_TTL:10}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Rate Limiting
app.rate-limit.requests-per-minute=${RATE_LIMIT:100}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# Presence
app.presence.heartbeat-timeout-seconds=${HEARTBEAT_TIMEOUT:90}

# Mail (SMTP)
# No credentials here - this file is committed. Supply them via environment
# variables, or via local.properties (gitignored, imported above).
# MAIL_ENABLED=false makes EmailService log the code instead of sending it.
# For Gmail, MAIL_USERNAME must be the full address and MAIL_PASSWORD an
# App Password (myaccount.google.com -> Security -> App passwords).
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email verification OTP (registration)
app.otp.ttl-minutes=${OTP_TTL_MINUTES:10}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN:60}

# Google OAuth2
google.oauth2.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
google.oauth2.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}